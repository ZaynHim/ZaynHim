<svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#2EA043" stop-opacity="0.32">
        <animate attributeName="stop-opacity" values="0.32;0.14;0.32" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#173B1F" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.07;0.18" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EA043" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2EA043" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2EA043" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="230" fill="#0d1117"/>
  <ellipse cx="450" cy="120" rx="430" ry="150" fill="url(#glow)"/>

  <text x="450" y="118" text-anchor="middle" fill="#e6edf3" font-size="74" font-weight="700" letter-spacing="2">Zayn</text>

  <rect x="280" y="148" width="340" height="2" rx="1" fill="url(#line)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="185" text-anchor="middle" fill="#8b949e" font-size="19" letter-spacing="1">Full Stack Developer — in training</text>
  <text x="450" y="212" text-anchor="middle" fill="#4d5566" font-size="14">Amman, Jordan</text>
</svg>
