<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect x="2" y="2" width="796" height="316" rx="18" fill="#0d1117" stroke="#2EA043" stroke-width="2"/>

  <!-- header -->
  <rect x="28" y="26" width="16" height="16" rx="4" fill="#2EA043"/>
  <text x="54" y="40" fill="#70C041" font-size="15" font-weight="bold" letter-spacing="3">FROGDEX</text>
  <text x="156" y="40" fill="#4d5566" font-size="12" letter-spacing="2">| DEVELOPER CARD</text>
  <circle cx="330" cy="35" r="4" fill="#70C041">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="342" y="40" fill="#70C041" font-size="11" letter-spacing="2">LIVE</text>
  <rect x="618" y="20" width="154" height="30" rx="15" fill="none" stroke="#2EA043"/>
  <text x="695" y="40" fill="#70C041" font-size="12" letter-spacing="2" text-anchor="middle">LV.5 TADPOLE</text>

  <!-- frog panel -->
  <rect x="28" y="70" width="190" height="210" rx="12" fill="#10161f" stroke="#1d2733"/>
  <ellipse cx="123" cy="238" rx="48" ry="7" fill="#000" opacity="0.5">
    <animate attributeName="rx" values="48;40;48" dur="1.6s" repeatCount="indefinite"/>
  </ellipse>
  <g transform="translate(64,120)">
    <animateTransform attributeName="transform" type="translate" values="64,120;64,110;64,120" dur="1.6s" repeatCount="indefinite"/>
    <g transform="scale(9)" shape-rendering="crispEdges">
      <g fill="#2EA043">
        <rect x="2" y="0" width="2" height="1"/><rect x="9" y="0" width="2" height="1"/>
        <rect x="1" y="1" width="4" height="1"/><rect x="8" y="1" width="4" height="1"/>
        <rect x="1" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/>
        <rect x="8" y="2" width="1" height="1"/><rect x="11" y="2" width="1" height="1"/>
        <rect x="1" y="3" width="11" height="1"/>
        <rect x="0" y="4" width="1" height="1"/><rect x="12" y="4" width="1" height="1"/>
        <rect x="0" y="5" width="1" height="1"/><rect x="12" y="5" width="1" height="1"/>
        <rect x="0" y="6" width="1" height="1"/><rect x="12" y="6" width="1" height="1"/>
        <rect x="1" y="7" width="1" height="1"/><rect x="11" y="7" width="1" height="1"/>
        <rect x="2" y="8" width="9" height="1"/>
      </g>
      <g fill="#70C041">
        <rect x="1" y="4" width="11" height="1"/>
        <rect x="1" y="5" width="11" height="1"/>
        <rect x="1" y="6" width="2" height="1"/><rect x="10" y="6" width="2" height="1"/>
        <rect x="2" y="7" width="9" height="1"/>
      </g>
      <g fill="#ffffff">
        <rect x="2" y="2" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/>
      </g>
      <g fill="#0d1117">
        <rect x="3" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/>
        <rect x="3" y="6" width="7" height="1"/>
      </g>
    </g>
  </g>
  <text x="123" y="268" fill="#58a6ff" font-size="12" letter-spacing="3" text-anchor="middle">BUILDER</text>

  <!-- identity -->
  <text x="248" y="110" fill="#70C041" font-size="30" font-weight="bold">@ZaynHim</text>
  <text x="248" y="134" fill="#8b949e" font-size="13">Zayn — Full Stack Developer, in training</text>

  <!-- xp bar -->
  <text x="248" y="168" fill="#4d5566" font-size="11" letter-spacing="2">XP — MONTH 5 / LOADING...</text>
  <rect x="248" y="178" width="520" height="14" rx="7" fill="#161b22"/>
  <rect x="248" y="178" width="215" height="14" rx="7" fill="#2EA043">
    <animate attributeName="width" values="0;215" dur="1.8s" fill="freeze"/>
  </rect>
  <text x="768" y="208" fill="#70C041" font-size="11" text-anchor="end">41%</text>

  <!-- stat boxes -->
  <g font-size="26" font-weight="bold" fill="#e6edf3" text-anchor="middle">
    <rect x="248" y="222" width="118" height="58" rx="10" fill="#10161f" stroke="#1d2733"/>
    <text x="307" y="252">5</text>
    <text x="307" y="270" font-size="10" fill="#4d5566" font-weight="normal" letter-spacing="2">MONTHS</text>
    <rect x="382" y="222" width="118" height="58" rx="10" fill="#10161f" stroke="#1d2733"/>
    <text x="441" y="252">3</text>
    <text x="441" y="270" font-size="10" fill="#4d5566" font-weight="normal" letter-spacing="2">REPOS</text>
    <rect x="516" y="222" width="118" height="58" rx="10" fill="#10161f" stroke="#1d2733"/>
    <text x="575" y="252">3</text>
    <text x="575" y="270" font-size="10" fill="#4d5566" font-weight="normal" letter-spacing="2">STACK</text>
    <rect x="650" y="222" width="118" height="58" rx="10" fill="#10161f" stroke="#1d2733"/>
    <text x="709" y="252" fill="#70C041">100%</text>
    <text x="709" y="270" font-size="10" fill="#4d5566" font-weight="normal" letter-spacing="2">FOCUS</text>
  </g>
</svg>
