<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.75" stop-color="#10161f"/>
      <stop offset="1" stop-color="#173B1F"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="796" height="196" rx="18" fill="url(#sky)" stroke="#2EA043" stroke-width="2"/>

  <!-- fireflies -->
  <circle cx="300" cy="40" r="2.5" fill="#70C041">
    <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="70" r="2" fill="#70C041">
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="35" r="2.5" fill="#70C041">
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- pixel water strip -->
  <g shape-rendering="crispEdges">
    <rect x="4" y="176" width="792" height="21" fill="#0e4429"/>
    <rect x="60" y="176" width="24" height="7" fill="#26a641" opacity="0.6"/>
    <rect x="210" y="183" width="30" height="7" fill="#26a641" opacity="0.4"/>
    <rect x="400" y="176" width="20" height="7" fill="#26a641" opacity="0.5"/>
    <rect x="610" y="183" width="26" height="7" fill="#26a641" opacity="0.4"/>
    <rect x="730" y="176" width="18" height="7" fill="#26a641" opacity="0.6"/>
  </g>

  <!-- identity -->
  <text x="40" y="76" fill="#70C041" font-size="40" font-weight="bold">@ZaynHim</text>
  <text x="42" y="100" fill="#8b949e" font-size="13">Zayn</text>
  <text x="42" y="128" fill="#4d5566" font-size="11" letter-spacing="2">3 REPOS &#8226; 2 FOLLOWERS &#8226; 3 STACK &#8226; 5 MONTHS</text>

  <!-- progress -->
  <rect x="42" y="144" width="540" height="12" rx="6" fill="#161b22"/>
  <rect x="42" y="144" width="222" height="12" rx="6" fill="#2EA043">
    <animate attributeName="width" values="0;222" dur="1.8s" fill="freeze"/>
  </rect>

  <!-- lily pad + frog -->
  <ellipse cx="692" cy="172" rx="56" ry="12" fill="#1a7f37"/>
  <ellipse cx="692" cy="169" rx="56" ry="12" fill="#2EA043"/>
  <g transform="translate(656,96)">
    <animateTransform attributeName="transform" type="translate" values="656,96;656,90;656,96" dur="1.8s" repeatCount="indefinite"/>
    <g transform="scale(5.5)" shape-rendering="crispEdges">
      <g fill="#2EA043">
        <rect x="2" y="0" width="2" height="1"/><rect x="9" y="0" width="2" height="1"/>
        <rect x="1" y="1" width="4" height="1"/><rect x="8" y="1" width="4" height="1"/>
        <rect x="1" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/>
        <rect x="8" y="2" width="1" height="1"/><rect x="11" y="2" width="1" height="1"/>
        <rect x="1" y="3" width="11" height="1"/>
        <rect x="0" y="4" width="1" height="1"/><rect x="12" y="4" width="1" height="1"/>
        <rect x="0" y="5" width="1" height="1"/><rect x="12" y="5" width="1" height="1"/>
        <rect x="1" y="6" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/>
        <rect x="2" y="7" width="9" height="1"/>
      </g>
      <g fill="#70C041">
        <rect x="1" y="4" width="11" height="1"/>
        <rect x="1" y="5" width="2" height="1"/><rect x="10" y="5" width="2" height="1"/>
        <rect x="2" y="6" width="9" height="1"/>
      </g>
      <g fill="#ffffff">
        <rect x="2" y="2" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/>
      </g>
      <g fill="#0d1117">
        <rect x="3" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/>
        <rect x="3" y="5" width="7" height="1"/>
      </g>
    </g>
  </g>
</svg>
